spring:
  application:
    name: donaciones-service
  jackson:
    time-zone: America/Argentina/Buenos_Aires
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

  # Base de Datos MySQL y JPA

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/donaciones_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 20MB

service:
  role: ROLE_DONACIONES_SERVICE
  username: Donaciones service

services:
  incentivos:
    url: ${SERVICES_INCENTIVOS_URL:http://localhost:8081}
  logistica:
    url: ${SERVICES_LOGISTICA_URL:http://localhost:8083}

donatrack:
  events:
    exchange: eventos
    routing-keys:
      #notificaciones: notificaciones
      notificacion:
        critica: notificacion.critica
        general: notificacion.general
        bulk: notificacion.bulk
      inicio-ruta: inicio.ruta
      entrega-exito: entrega.exito
      entrega-no-satisfactoria: entrega.no.satisfactoria
    queues:
      inicio-ruta: donaciones.inicio-ruta.queue
      entrega-exito: donaciones.entrega-exito.queue
      entrega-no-satisfactoria: donaciones.entrega-no-satisfactoria.queue

jwt:
  secret: ${JWT_SECRET:dev-only-change-me}
