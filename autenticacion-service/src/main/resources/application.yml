spring:
  application:
    name: autenticacion-service
  jackson:
    time-zone: America/Argentina/Buenos_Aires

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/autenticacion_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8084

service:
  role: ROLE_AUTENTICACION_SERVICE
  username: Autenticacion service

jwt:
  secret: ${JWT_SECRET:dev-only-change-me}

logging:
  level:
    org.springframework.security: DEBUG
    ar.edu.utn.frba.dds: DEBUG